          - { name: body, label: "Text de la pàgina", widget: markdown, required: false, hint: "Per posar-hi un vídeo, enganxa l'enllaç de YouTube sol en una línia. Per a una foto, fes servir el botó d'imatge." }
      - name: serveis-gent-gran
        label: Serveis per a la gent gran
        file: src/content/pagines/serveis-gent-gran.md
        fields:
          - { name: titol, label: Títol de la pàgina, widget: string }
          - { name: sobre, label: Text petit sobre el títol, widget: string, required: false }
          - { name: entrada, label: Frase d'entrada, widget: text, required: false }
          - { name: descripcio, label: Descripció per als cercadors, widget: string, required: false, hint: "Una frase. No surt a la pàgina: és el que mostren Google i les xarxes en compartir-la." }
          - name: to
            label: Color de la capçalera
            widget: select
            default: verd
            options:
              - { label: Verd, value: verd }
              - { label: Blau, value: blau }
              - { label: Terra, value: terra }
          - { name: body, label: "Text de la pàgina", widget: markdown, required: false, hint: "Per posar-hi un vídeo, enganxa l'enllaç de YouTube sol en una línia. Per a una foto, fes servir el botó d'imatge." }
      - name: saiar
        label: SAIAR de Can Torra
        file: src/content/pagines/saiar.md
        fields:
          - { name: titol, label: Títol de la pàgina, widget: string }
          - { name: sobre, label: Text petit sobre el títol, widget: string, required: false }
          - { name: entrada, label: Frase d'entrada, widget: text, required: false }
          - { name: descripcio, label: Descripció per als cercadors, widget: string, required: false, hint: "Una frase. No surt a la pàgina: és el que mostren Google i les xarxes en compartir-la." }
          - name: to
            label: Color de la capçalera
            widget: select
            default: verd
            options:
              - { label: Verd, value: verd }
              - { label: Blau, value: blau }
              - { label: Terra, value: terra }
          - { name: body, label: "Text de la pàgina", widget: markdown, required: false, hint: "Per posar-hi un vídeo, enganxa l'enllaç de YouTube sol en una línia. Per a una foto, fes servir el botó d'imatge." }
      - name: privacitat
        label: Privacitat
        file: src/content/pagines/privacitat.md
        fields:
          - { name: titol, label: Títol de la pàgina, widget: string }
          - { name: sobre, label: Text petit sobre el títol, widget: string, required: false }
          - { name: entrada, label: Frase d'entrada, widget: text, required: false }
          - { name: descripcio, label: Descripció per als cercadors, widget: string, required: false, hint: "Una frase. No surt a la pàgina: és el que mostren Google i les xarxes en compartir-la." }
          - name: to
            label: Color de la capçalera
            widget: select
            default: verd
            options:
              - { label: Verd, value: verd }
              - { label: Blau, value: blau }
              - { label: Terra, value: terra }
          - { name: body, label: "Text de la pàgina", widget: markdown, required: false, hint: "Si s'afegeix al web cap servei extern nou (mapes, vídeos, formularis...), cal explicar-ho aquí." }
      - name: accessibilitat
        label: Accessibilitat
        file: src/content/pagines/accessibilitat.md
        fields:
          - { name: titol, label: Títol de la pàgina, widget: string }
          - { name: sobre, label: Text petit sobre el títol, widget: string, required: false }
          - { name: entrada, label: Frase d'entrada, widget: text, required: false }
          - { name: descripcio, label: Descripció per als cercadors, widget: string, required: false, hint: "Una frase. No surt a la pàgina: és el que mostren Google i les xarxes en compartir-la." }
          - name: to
            label: Color de la capçalera
            widget: select
            default: verd
            options:
              - { label: Verd, value: verd }
              - { label: Blau, value: blau }
              - { label: Terra, value: terra }
          - { name: body, label: "Text de la pàgina", widget: markdown, required: false, hint: "Quan es revisi la declaració, actualitza la data del final." }

  # ── Documents ───────────────────────────────────────────────────────────
  - name: documents
    label: Documents
    label_singular: Document
    folder: src/content/documents
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{tipus}} · {{titol}}"
    fields:
      - { name: titol, label: Títol, widget: string }
      - name: tipus
        label: Apartat
        widget: select
        default: Altres
        options:
          - Reglaments
          - Informes i processos participatius
          - Enquestes
          - Altres
      - { name: fitxer, label: Fitxer, widget: file, media_folder: /public/documents, public_folder: /documents, hint: "Millor en PDF. Es desa a la carpeta de documents del web." }
      - { name: quan, label: Data, widget: string, required: false, hint: "Com vulguis que surti. Per exemple: Setembre de 2022" }
      - { name: descripcio, label: Descripció, widget: text, required: false }
      - { name: ordre, label: Ordre dins l'apartat, widget: number, default: 99, value_type: int, hint: "Els números petits surten primer." }

  # ── Dades generals ──────────────────────────────────────────────────────
  - name: general
    label: Dades generals
    files:
      - name: general
        label: Contacte i xarxes
        file: src/content/general/general.md
        fields:
          - { name: correu, label: Correu electrònic, widget: string, hint: "Surt a Participa-hi, a les pàgines dels cercles i al peu." }
          - { name: whatsapp, label: Enllaç del canal de WhatsApp, widget: string, required: false }
          - { name: whatsappText, label: Descripció del canal de WhatsApp, widget: string, required: false }
          - { name: instagram, label: Enllaç d'Instagram, widget: string, required: false }
          - { name: instagramUsuari, label: "Nom d'usuari d'Instagram", widget: string, required: false }
          - { name: lema, label: Lema (peu de pàgina), widget: string, required: false }
          - { name: creditFotos, label: Autoria de les fotografies (peu de pàgina), widget: string, required: false }
