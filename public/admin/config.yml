backend:
  name: github
  repo: consell-de-poble-santa-pau/web
  branch: main
  base_url: https://sveltia-cms-auth.cdpsantapau.workers.dev
  # Boto 'Inicia la sessio amb GitHub' (GitHub App Panell web CdP Santa Pau)
locale: ca
slug:
  encoding: ascii
  clean_accents: true
media_folder: public/imatges
public_folder: /imatges

# NOTA: Sveltia CMS encara no implementa l'editorial workflow (branques de revisio
# per entrada). Tot el que es desa va directament a 'main' i es publica.
# Els esborranys es gestionen amb el camp 'estat' de cada acta, que fa sortir
# un avis visible a la pagina mentre no estigui aprovada.

collections:
  - name: actes
    label: Actes de reunions
    label_singular: Acta
    folder: src/content/actes
    create: true
    delete: true
    slug: "{{year}}-{{month}}-{{day}}-{{cercle}}"
    sortable_fields: [data]
    fields:
      - { name: titol, label: Títol, widget: string }
      - { name: data, label: Data de la reunió, widget: datetime, format: "YYYY-MM-DD", time_format: false }
      - name: cercle
        label: Cercle
        widget: relation
        collection: cercles
        value_field: "{{slug}}"
        search_fields: [nom]
        display_fields: [nom]
        default: coordinacio
        hint: "Els cercles surten de la col·lecció Cercles. Si se'n crea un de nou, apareix aquí sol."
      - name: estat
        label: Estat
        widget: select
        default: esborrany
        options:
          - { label: Esborrany, value: esborrany }
          - { label: Aprovada, value: aprovada }
      - { name: assistents, label: Assistents, widget: list, required: false }
      - { name: pdf, label: PDF de l'acta, widget: file, required: false }
      - { name: body, label: Text de l'acta, widget: markdown }

  - name: agenda
    label: Agenda
    label_singular: Trobada o activitat
    folder: src/content/agenda
    create: true
    identifier_field: titol
    slug: "{{fields.data}}-{{slug}}"
    sortable_fields: [data]
    summary: "{{data}} · {{titol}}"
    fields:
      - { name: titol, label: Títol, widget: string }
      - { name: data, label: Dia, widget: datetime, format: "YYYY-MM-DD", time_format: false }
      - name: hora
        label: Hora d'inici
        widget: datetime
        required: false
        format: "HH:mm"
        date_format: false
        time_format: "HH:mm"
        hint: "Deixa-ho buit si dura tot el dia."
      - name: horaFi
        label: Hora d'acabament
        widget: datetime
        required: false
        format: "HH:mm"
        date_format: false
        time_format: "HH:mm"
        hint: "Opcional. Si no hi és, al calendari hi consten dues hores."
      - name: tipus
        label: Tipus
        widget: select
        default: reunio
        options:
          - { label: Reunió o trobada de treball, value: reunio }
          - { label: Activitat, value: activitat }
      - name: cercle
        label: Cercle que la convoca
        widget: relation
        collection: cercles
        value_field: "{{slug}}"
        search_fields: [nom]
        display_fields: [nom]
        required: false
        hint: "Els cercles surten de la col·lecció Cercles. Si se'n crea un de nou, apareix aquí sol."
      - { name: lloc, label: On, widget: string, required: false, hint: "Per exemple: Sala del Casal, Santa Pau" }
      - { name: oberta, label: Oberta a tothom, widget: boolean, default: true }
      - { name: cancellada, label: Cancel·lada, widget: boolean, default: false }
      - { name: nota, label: Nota, widget: string, required: false, hint: "Motiu d'una cancel·lació o qualsevol avís curt." }
      - { name: ordreDia, label: Ordre del dia (document), widget: file, required: false }
      - name: acta
        label: Acta publicada
        widget: relation
        required: false
        collection: actes
        search_fields: [titol]
        display_fields: [titol]
        value_field: "{{slug}}"
        hint: "S'omple després de la reunió, quan l'acta ja és al web."
      - { name: body, label: Ordre del dia o descripció, widget: markdown, required: false }
      - name: difusio
        label: Difusió per WhatsApp
        widget: difusio-whatsapp
        required: false
        hint: "Quan hagis desat i l'esdeveniment ja surti al web (un parell de minuts), copia el missatge o obre el WhatsApp i envia'l al canal del Consell. Aquest camp no surt al web."

  - name: noticies
    label: Notícies
    label_singular: Notícia
    folder: src/content/noticies
    create: true
    delete: true
    identifier_field: titol
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { name: titol, label: Títol, widget: string }
      - { name: data, label: Data, widget: datetime, format: "YYYY-MM-DD", time_format: false }
      - { name: entradeta, label: Entradeta, widget: text, hint: "Una o dues frases. Surt a la portada." }
      - { name: imatge, label: Imatge, widget: image, required: false }
      - { name: imatgeAlt, label: Descripció de la imatge, widget: string, required: false, hint: "Obligatòria si hi ha imatge. Descriu què s'hi veu." }
      - { name: credit, label: Autoria de la imatge, widget: string, default: "Jacint Garrigolas Coll" }
      - { name: body, label: Text, widget: markdown }

  - name: cercles
    label: Cercles
    label_singular: Cercle
    folder: src/content/cercles
    create: true
    delete: false
    identifier_field: nom
    summary: "{{nom}}"
    fields:
      - { name: nom, label: Nom del cercle, widget: string }
      - name: tipus
        label: Tipus
        widget: select
        default: estrategic
        options:
          - { label: "Estratègic — treballa un àmbit de manera continuada", value: estrategic }
          - { label: "Operatiu — creat per a una acció concreta", value: operatiu }
          - { label: "Coordinació — només n'hi ha un, no en creïs cap altre", value: coordinacio }
      - { name: entradeta, label: En una frase, widget: text, hint: "Què fa aquest cercle. Surt a la portada i al llistat." }
      - { name: dataInici, label: Data de creació, widget: datetime, format: "YYYY-MM-DD", time_format: false }
      - name: color
        label: Color
        widget: select
        default: "#30A860"
        options:
          - { label: Verd, value: "#30A860" }
          - { label: Verd fosc, value: "#006018" }
          - { label: Coral, value: "#D86048" }
          - { label: Blau, value: "#4890C0" }
          - { label: Terra, value: "#A84848" }
          - { label: Sorra, value: "#C09060" }
          - { label: Sol, value: "#F5921E" }
          - { label: Ocre, value: "#B5761F" }
          - { label: Blau fosc, value: "#21384A" }
      - { name: icona, label: Icona, widget: image, required: false,
          hint: "Si no se'n posa cap, es fa servir l'isotip del Consell." }
      - { name: ordre, label: Ordre al llistat, widget: number, default: 99 }
      - { name: imatge, label: Foto de capçalera, widget: string, required: false,
          hint: "Nom de la foto preparada a /imatges/, sense mida ni extensió (per exemple: salt-aigua). Deixa-ho buit si no n'hi ha." }
      - { name: imatgeAlt, label: Descripció de la foto, widget: string, required: false }
      - { name: body, label: Descripció, widget: markdown }

      # --- Tancar un cercle ---
      # No s'esborra mai el cercle: se li posa data de fi i passa a l'arxiu,
      # de manera que la seva pàgina i les seves actes es conserven.
      - { name: dataFi, label: "Data de tancament (deixar buit si és actiu)", widget: datetime,
          format: "YYYY-MM-DD", time_format: false, required: false }
      - { name: motiuTancament, label: Per què s'ha tancat, widget: text, required: false }

  # ── Pàgines ─────────────────────────────────────────────────────────────
  # Els textos de cada pàgina del web. Les parts que es fan soles (llistats
  # de cercles, agenda, actes, notícies, documents, mapa) no s'editen aquí.
  - name: pagines
    label: Pàgines
    label_singular: Pàgina
    files:
      - name: portada
        label: Portada
        file: src/content/pagines/portada.md
        fields:
          - { name: titol, label: Títol gran, widget: text, hint: "Cada salt de línia que hi posis surt també al títol." }
          - { name: sobre, label: Text petit sobre el títol, widget: string, required: false }
          - { name: entrada, label: Frase d'entrada, widget: text, required: false }
          - { name: descripcio, label: Descripció per als cercadors, widget: string, required: false, hint: "Una frase. No surt a la pàgina: és el que mostren Google i les xarxes en compartir-la." }
          - { name: boto1Text, label: Botó principal (text), widget: string, required: false }
          - { name: boto1Enllac, label: Botó principal (enllaç), widget: string, required: false, hint: "Per exemple: /participa/" }
          - { name: boto2Text, label: Segon botó (text), widget: string, required: false }
          - { name: boto2Enllac, label: Segon botó (enllaç), widget: string, required: false }
          - { name: cerclesSobre, label: "Cercles: text petit", widget: string, required: false }
          - { name: cerclesTitol, label: "Cercles: títol", widget: string, required: false }
          - { name: cerclesIntro, label: "Cercles: presentació", widget: text, required: false }
          - name: idees
            label: Les tres idees
            label_singular: Idea
            widget: list
            required: false
            fields:
              - { name: titol, label: Títol, widget: string }
              - { name: text, label: Text, widget: text }
          - { name: noticiesSobre, label: "Notícies: text petit", widget: string, required: false }
          - { name: noticiesTitol, label: "Notícies: títol", widget: string, required: false }
      - name: el-consell
        label: El Consell
        file: src/content/pagines/el-consell.md
        fields:
          - { name: titol, label: Títol de la pàgina, widget: string }
          - { name: sobre, label: Text petit sobre el títol, widget: string, required: false }
          - { name: entrada, label: Frase d'entrada, widget: text, required: false }
          - { name: descripcio, label: Descripció per als cercadors, widget: string, required: false, hint: "Una frase. No surt a la pàgina: és el que mostren Google i les xarxes en compartir-la." }
          - name: to
            label: Color de la capçalera
            widget: select
            default: verd
            options:
              - { label: Verd, value: verd }
              - { label: Blau, value: blau }
              - { label: Terra, value: terra }
          - { name: body, label: "Text de la pàgina", widget: markdown, required: false, modes: [raw, rich_text], hint: "La taula es pot editar en mode Markdown (és el mode en què s'obre aquest camp). Per posar-hi un vídeo, enganxa l'enllaç de YouTube sol en una línia. Per a una foto, fes servir el botó d'imatge." }
          - { name: coordinacioTitol, label: "Cercle de Coordinació: títol", widget: string, required: false }
          - { name: coordinacioNota, label: "Cercle de Coordinació: nota sota el títol", widget: string, required: false }
          - { name: membres, label: Persones del poble escollides, label_singular: Persona, widget: list, required: false }
          - { name: ajuntament, label: "Per part de l'Ajuntament", label_singular: Persona, widget: list, required: false, hint: "Si una plaça és vacant, escriu-ho així i sortirà en cursiva: Segona plaça vacant" }
          - { name: coordinacioPeu, label: "Cercle de Coordinació: nota final", widget: text, required: false }
      - name: cercles
        label: Cercles
        file: src/content/pagines/cercles.md
        fields:
          - { name: titol, label: Títol de la pàgina, widget: string }
          - { name: sobre, label: Text petit sobre el títol, widget: string, required: false }
          - { name: entrada, label: Frase d'entrada, widget: text, required: false }
          - { name: descripcio, label: Descripció per als cercadors, widget: string, required: false, hint: "Una frase. No surt a la pàgina: és el que mostren Google i les xarxes en compartir-la." }
          - name: to
            label: Color de la capçalera
            widget: select
            default: verd
            options:
              - { label: Verd, value: verd }
              - { label: Blau, value: blau }
              - { label: Terra, value: terra }
          - { name: body, label: "Text opcional sota la capçalera", widget: markdown, required: false, hint: "Per posar-hi un vídeo, enganxa l'enllaç de YouTube sol en una línia. Per a una foto, fes servir el botó d'imatge." }
          - { name: notaEstrategics, label: Nota sota «Cercles Estratègics», widget: string, required: false }
          - { name: notaOperatius, label: Nota sota «Cercles Operatius», widget: string, required: false }
          - { name: notaTancats, label: Nota sota «Cercles tancats», widget: string, required: false }
      - name: agenda
        label: Agenda
        file: src/content/pagines/agenda.md
        fields:
          - { name: titol, label: Títol de la pàgina, widget: string }
          - { name: sobre, label: Text petit sobre el títol, widget: string, required: false }
          - { name: entrada, label: Frase d'entrada, widget: text, required: false }
          - { name: descripcio, label: Descripció per als cercadors, widget: string, required: false, hint: "Una frase. No surt a la pàgina: és el que mostren Google i les xarxes en compartir-la." }
          - name: to
            label: Color de la capçalera
            widget: select
            default: verd
            options:
              - { label: Verd, value: verd }
              - { label: Blau, value: blau }
              - { label: Terra, value: terra }
          - { name: body, label: "Text opcional sota la capçalera", widget: markdown, required: false, hint: "El calendari i les trobades surten sols, de la col·lecció Agenda." }
      - name: reunions
        label: Reunions i actes
        file: src/content/pagines/reunions.md
        fields:
          - { name: titol, label: Títol de la pàgina, widget: string }
          - { name: sobre, label: Text petit sobre el títol, widget: string, required: false }
          - { name: entrada, label: Frase d'entrada, widget: text, required: false }
          - { name: descripcio, label: Descripció per als cercadors, widget: string, required: false, hint: "Una frase. No surt a la pàgina: és el que mostren Google i les xarxes en compartir-la." }
          - name: to
            label: Color de la capçalera
            widget: select
            default: verd
            options:
              - { label: Verd, value: verd }
              - { label: Blau, value: blau }
              - { label: Terra, value: terra }
          - { name: body, label: "Text sobre la llista d'actes", widget: markdown, required: false, hint: "Les actes surten soles, de la col·lecció Actes. Per fer un requadre destacat, fes servir el botó de cita." }
      - name: noticies
        label: Notícies
        file: src/content/pagines/noticies.md
        fields:
          - { name: titol, label: Títol de la pàgina, widget: string }
          - { name: sobre, label: Text petit sobre el títol, widget: string, required: false }
          - { name: entrada, label: Frase d'entrada, widget: text, required: false }
          - { name: descripcio, label: Descripció per als cercadors, widget: string, required: false, hint: "Una frase. No surt a la pàgina: és el que mostren Google i les xarxes en compartir-la." }
          - name: to
            label: Color de la capçalera
            widget: select
            default: verd
            options:
              - { label: Verd, value: verd }
              - { label: Blau, value: blau }
              - { label: Terra, value: terra }
          - { name: body, label: "Text opcional sobre la llista de notícies", widget: markdown, required: false }
      - name: mapa
