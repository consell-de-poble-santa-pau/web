          - { name: descripcio, label: Descripció per als cercadors, widget: string, required: false, hint: "Una frase. No surt a la pàgina: és el que mostren Google i les xarxes en compartir-la." }
          - name: to
            label: Color de la capçalera
            widget: select
            default: verd
            options:
              - { label: Verd, value: verd }
              - { label: Blau, value: blau }
              - { label: Terra, value: terra }
          - { name: body, label: "Text sota el mapa", widget: markdown, required: false, hint: "Per posar-hi un vídeo, enganxa l'enllaç de YouTube sol en una línia. Per a una foto, fes servir el botó d'imatge." }
      - name: participa
        label: Participa-hi
        file: src/content/pagines/participa.md
        fields:
          - { name: titol, label: Títol de la pàgina, widget: string }
          - { name: sobre, label: Text petit sobre el títol, widget: string, required: false }
          - { name: entrada, label: Frase d'entrada, widget: text, required: false }
          - { name: descripcio, label: Descripció per als cercadors, widget: string, required: false, hint: "Una frase. No surt a la pàgina: és el que mostren Google i les xarxes en compartir-la." }
          - name: to
            label: Color de la capçalera
            widget: select
            default: verd
            options:
              - { label: Verd, value: verd }
              - { label: Blau, value: blau }
              - { label: Terra, value: terra }
          - { name: body, label: "Text abans de la llista de cercles", widget: markdown, required: false, hint: "La llista de cercles i els canals surten sols." }
          - { name: canalsTitol, label: Títol dels canals, widget: string, required: false, hint: "Els enllaços dels canals es canvien a Dades generals." }
          - { name: canalsNota, label: Nota sota els canals, widget: text, required: false }
          - { name: textFinal, label: Text final (després dels canals), widget: markdown, required: false, hint: "Per posar-hi un vídeo, enganxa l'enllaç de YouTube sol en una línia. Per a una foto, fes servir el botó d'imatge." }
      - name: documents
        label: Documents
